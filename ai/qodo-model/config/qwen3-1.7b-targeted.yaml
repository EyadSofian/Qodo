model: mlx-community/Qwen3-1.7B-4bit
train: true
data: data/generated
fine_tune_type: lora
mask_prompt: true
seed: 20260813

# Final targeted pass for aggregate routing, ad-spend routing, and ambiguous
# assignee-only requests found by the frozen golden evaluation.
num_layers: 16
batch_size: 2
iters: 40
val_batches: -1
learning_rate: 0.00002
steps_per_report: 10
steps_per_eval: 20
save_every: 20
max_seq_length: 1536
grad_checkpoint: true
resume_adapter_file: artifacts/qwen3-1.7b-safety/adapters.safetensors
adapter_path: artifacts/qwen3-1.7b-targeted

lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 2.0
