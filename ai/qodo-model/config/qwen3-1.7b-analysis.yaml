model: mlx-community/Qwen3-1.7B-4bit
train: true
data: data/generated
fine_tune_type: lora
mask_prompt: true
seed: 20260814

# Decision-and-long-context continuation. Live company facts remain in tools;
# this pass teaches structured 20-message summaries, evidence separation and
# the decision_brief route introduced after the first production checkpoint.
num_layers: 16
batch_size: 2
iters: 100
val_batches: -1
learning_rate: 0.000015
steps_per_report: 10
steps_per_eval: 20
save_every: 20
max_seq_length: 2048
grad_checkpoint: true
resume_adapter_file: artifacts/qwen3-1.7b-targeted/adapters.safetensors
adapter_path: artifacts/qwen3-1.7b-analysis

lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 2.0
